# Versions taken over from the prototype (prototype/gradle/libs.versions.toml).
# Modules may append entries below in a section marked with the module name.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
# Newest BOM that still works with compileSdk 36. BOM 2026.08.00 and later
# (Compose 1.12.x) require compileSdk 37.
composeBom = "2026.06.01"
activityCompose = "1.13.0"
autofill = "1.3.0"
kotpass = "0.13.0"
okio = "3.15.0"
smbj = "0.15.0"
argon2kt = "1.6.0"
junit = "6.1.3"
# :platform
kotlinxCoroutines = "1.11.0"
work = "2.12.0"
# Same 2.0.x line as the slf4j-api that smbj 0.15.0 depends on.
slf4j = "2.0.18"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
junit4 = "4.13.2"
# Unit tests of :app only: the real org.json, because the Android stub of the JSON parser does not run on the JVM.
orgJson = "20250517"
# :app, open-source licenses page (plugin collects the release/dev runtime classpath, core parses the JSON).
# 14.2.1 is the newest release that compiles against compileSdk 36; 15.0.0 and later need compileSdk 37.
aboutLibraries = "14.2.1"

[libraries]
# Android app
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
# Native Argon2 (JNI, MIT). Only uses androidx.annotation, so exclude appcompat where used.
argon2kt = { group = "com.lambdapioneer.argon2kt", name = "argon2kt", version.ref = "argon2kt" }

# KDBX: kotpass exposes okio types in its API but declares okio only as runtime dependency.
kotpass = { group = "app.keemobile", name = "kotpass", version.ref = "kotpass" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

# SMB
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }

# Tests (JUnit Jupiter in all JVM modules)
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

# :platform
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
# smbj logs through SLF4J; the no-op binding keeps everything out of logcat (SE-07).
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }
# Instrumented tests of :platform and :app (JUnit 4 with AndroidJUnitRunner)
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
# Open-source licenses page of :app. The plugin generates the data, only the core module is used at runtime (no stock UI).
aboutlibraries-core = { group = "com.mikepenz", name = "aboutlibraries-core", version.ref = "aboutLibraries" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }
