# Check for every pull request against main (also from forks): unit tests and an
# unsigned release build. No secrets are used. Required by the ruleset on main.
name: PR-Prüfung

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the running check.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source cache on GitHub Actions cache, not the commercial default.
          cache-provider: basic

      - name: Tests und Release-Build (unsigniert)
        run: ./gradlew test :app:assembleRelease
