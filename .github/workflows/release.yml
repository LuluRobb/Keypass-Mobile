# Every push to main publishes a new GitHub release, marked as latest.
# The jobs "Test" and "Build APK" run in parallel; "Publish release" only runs when
# both succeeded. "Submit dependencies" runs alongside and never blocks the release.
#
# Versioning: the workflow run number N is passed to Gradle as KPM_BUILD_NUMBER, which
# makes versionCode = N and versionName = <base version>.N (see app/build.gradle.kts).
# For base version 0.1.0 and run 3: tag v0.1.0.3, title "Keypass Mobile 0.1.0.3",
# file Keypass-Mobile-0-1-0-3.apk. Tag and versionName match, so updaters such as
# Obtainium can compare the release with the installed app.
#
# Secrets: KPM_KEYSTORE_BASE64 (release.jks as base64), KPM_KEYSTORE_PASSWORD
# (store and key password, PKCS12 uses one password for both). Only "Build APK" gets them.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases run one after another, none is cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source cache on GitHub Actions cache, not the commercial default.
          cache-provider: basic

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
      version: ${{ steps.apk.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source cache on GitHub Actions cache, not the commercial default.
          cache-provider: basic

      - name: Provide signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KPM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KPM_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build and sign release APK
        env:
          KPM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KPM_KEYSTORE_PASSWORD: ${{ secrets.KPM_KEYSTORE_PASSWORD }}
          KPM_KEY_ALIAS: keypass-mobile
          KPM_KEY_PASSWORD: ${{ secrets.KPM_KEYSTORE_PASSWORD }}
          KPM_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Check version and name APK
        id: apk
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          badging=$("$build_tools/aapt2" dump badging "$apk")
          version=$(printf '%s\n' "$badging" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")
          code=$(printf '%s\n' "$badging" | sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p")
          echo "versionName=$version versionCode=$code"
          if [ "$code" != "$BUILD_NUMBER" ] || [[ "$version" != *".$BUILD_NUMBER" ]]; then
            echo "::error::APK has versionName '$version' and versionCode '$code', expected <base>.$BUILD_NUMBER and $BUILD_NUMBER"
            exit 1
          fi
          name="Keypass-Mobile-${version//./-}.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          echo "APK: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Store APK for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: dist/${{ needs.build.outputs.apk-name }}
        run: |
          tag="v$VERSION"
          # A re-run of the same workflow run keeps its run number and thus its tag,
          # so replace that release.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Keypass Mobile $VERSION" \
            --generate-notes \
            --latest

  # Reports the resolved Gradle dependencies to GitHub so that Dependabot alerts (SE-10)
  # also cover the version catalog and transitive dependencies. GitHub cannot read
  # libs.versions.toml on its own. Only what ships in the release APK is reported:
  # releaseRuntimeClasspath of :app, which contains all modules and their libraries.
  # Build tools (Android Gradle Plugin, 'classpath'), test and debug-only libraries
  # never reach the phone and are left out.
  dependencies:
    name: Submit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve and submit dependencies
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source cache on GitHub Actions cache, not the commercial default.
          cache-provider: basic
          dependency-graph: generate-and-submit
          dependency-graph-include-projects: "^:app$"
          dependency-graph-include-configurations: "^releaseRuntimeClasspath$"
