# Every push to main: run the unit tests, build the signed
# release APK and publish it as a new GitHub release (tag build-N, marked as latest).
# The APK is named Keypass-Mobile-<versionName with dashes>.apk, e.g. Keypass-Mobile-0-1-0.apk,
# so .../releases/latest/download/<name> always points to the newest build of a version.
# A separate job reports the Gradle dependencies to GitHub for the Dependabot alerts.
#
# Secrets: KPM_KEYSTORE_BASE64 (release.jks as base64), KPM_KEYSTORE_PASSWORD
# (store and key password, PKCS12 uses one password for both).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases run one after another, none is cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Signierte APK bauen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source cache on GitHub Actions cache, not the commercial default.
          cache-provider: basic

      - name: Tests
        run: ./gradlew test

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KPM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KPM_KEYSTORE_BASE64 fehlt"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release-APK bauen
        env:
          KPM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KPM_KEYSTORE_PASSWORD: ${{ secrets.KPM_KEYSTORE_PASSWORD }}
          KPM_KEY_ALIAS: keypass-mobile
          KPM_KEY_PASSWORD: ${{ secrets.KPM_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Signatur prüfen und APK benennen
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs "$apk"
          version=$("$build_tools/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ -z "$version" ]; then
            echo "::error::versionName nicht gefunden"
            exit 1
          fi
          name="Keypass-Mobile-${version//./-}.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: dist

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          BUILD: ${{ github.run_number }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: dist/${{ needs.build.outputs.apk-name }}
        run: |
          # A re-run of the same workflow run reuses its tag, so replace that release.
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Keypass Mobile $VERSION (Build $BUILD)" \
            --generate-notes \
            --latest

  # Reports the resolved Gradle dependencies to GitHub so that Dependabot alerts (SE-10)
  # also cover the version catalog and transitive dependencies. GitHub cannot read
  # libs.versions.toml on its own. Runs in parallel and does not block the release.
  dependencies:
    name: Abhängigkeiten an GitHub melden
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source cache on GitHub Actions cache, not the commercial default.
          cache-provider: basic
          dependency-graph: generate-and-submit
