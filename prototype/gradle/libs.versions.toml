[versions]
agp = "9.5.0"
kotlin = "2.4.21"
# Newest BOM that still works with compileSdk 36. BOM 2026.08.00 and later
# (Compose 1.12.x) require compileSdk 37.
composeBom = "2026.06.01"
activityCompose = "1.13.0"
autofill = "1.3.0"
kotpass = "0.13.0"
smbj = "0.15.0"
junit = "6.1.3"

[libraries]
# Android app
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }

# Feature libraries
kotpass = { group = "app.keemobile", name = "kotpass", version.ref = "kotpass" }
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }

# Tests
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# KDBX prototype (appended). kotpass exposes okio types in its API but declares
# okio only as runtime dependency; same version as kotpass 0.13.0 uses.
[libraries.okio]
module = "com.squareup.okio:okio"
version = "3.15.0"

# KDBX prototype: native Argon2 (JNI, MIT) for the comparison measurement in :app.
[libraries.argon2kt]
module = "com.lambdapioneer.argon2kt:argon2kt"
version = "1.6.0"
